name: Feature request
description: Propose an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Route-preserving invariants
      options:
        - label: The proposal can keep the selected text provider/model unchanged.
        - label: The proposal can keep DSH Settings as the mapping source of truth.

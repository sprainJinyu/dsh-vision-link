name: Bug report
description: Report a reproducible dsh-vision-link problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private images, complete settings files, or unrelated logs.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: DSH version, dsh-vision-link version, Node.js version, and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps and a sanitized mapping using example provider/model ids.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private URLs, local paths, conversation data, and private screenshots.
          required: true
